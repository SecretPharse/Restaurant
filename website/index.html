<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Login -->
    <div class="login" id="login">
        <div class="header">
            <span class="text1">Masuk</span>
            <span class="text2">Selamat datang kembali</span>
        </div>
        <div class="middle">
            <div class="email">
                <span>Email</span>
                <input type="email" placeholder="Masukan Email" autocomplete="off">
            </div>
            <div class="password">
                <span>Kata Sandi</span>
                <div class="sensor">
                    <input id="password-login" type="password" placeholder="Masukan Kata Sandi">
                    <img id="sensor-login" src="assets/visibility_off.svg">
                </div>
            </div>
        </div>
        <div class="bottom">
            <span class="link-global" style="margin: 0 0 0 auto;">Lupa kata sandi?</span>
            <button class="submit">
                <span>Masuk</span>
                <div class="spinner" hidden></div>
            </button>
            <span>Belum punya akun? <span class="link-global" id="login-to-register">Daftar Sekarang</span></span>
        </div>
    </div>

    <!-- Register Page 1 -->
    <div class="register-page1" id="register">
        <div class="header">
            <span class="text1">Daftar</span>
            <span class="text2">Mulai dengan mudah bersama kami</span>
        </div>
        <div class="middle">
            <div class="name">
                <span>Nama</span>
                <input type="text" placeholder="Nama">
            </div>
            <div class="email">
                <span>Kata Sandi</span>
                <input id="" type="email" placeholder="email" autocomplete="off">
            </div>
            <div class="phone">
                <span>No Telp</span>
                <input id="" type="number" placeholder="nomor telephone">
            </div>
            <div class="address">
                <span>Alamat</span>
                <input id="" type="text" placeholder="Alamat">
            </div>
        </div>
        <div class="bottom">
            <button class="submit">
                <span>Lanjut</span>
            </button>
            <span>Sudah punya akun? <span class="link-global" id="register-to-login">Masuk Sekarang</span></span>
        </div>
    </div>

</body>
<script src="script.js"></script>

</html>
